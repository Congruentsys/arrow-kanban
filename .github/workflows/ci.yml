# SPDX-License-Identifier: MIT
# arrow-kanban CI — clean-clone build/test + the BLOCKING FOSS export gate.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # (a) The open crate must build + test from a clean clone with ZERO path/monorepo
  # deps — everything resolves from crates.io. `--locked` pins Cargo.lock so a
  # dependency drift can't silently change what ships.
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: fmt
        run: cargo fmt --all --check
      # 3 feature profiles × both workspace crates (lib + server) — E-AK2.
      - name: build (workspace, default)
        run: cargo build --workspace --locked --verbose
      - name: build (workspace, no default features)
        run: cargo build --workspace --locked --no-default-features --verbose
      - name: build (workspace, all features)
        run: cargo build --workspace --locked --all-features --verbose
      - name: test (workspace, default)
        run: cargo test --workspace --locked --verbose
      - name: test (workspace, no default features)
        run: cargo test --workspace --locked --no-default-features --verbose
      - name: test (workspace, all features)
        run: cargo test --workspace --locked --all-features --verbose
      - name: clippy (workspace, all targets + features)
        run: cargo clippy --workspace --all-targets --locked --all-features -- -D warnings

  # (b)(c)(d) The BLOCKING export gate — closed-vocabulary scan, no board/research
  # data, license + SPDX. A closed-source leak fails the build.
  export-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: FOSS export gate
        run: bash scripts/export-gate.sh

  # The committed mutation demonstration: proves the export gate goes RED on
  # each closed-material injection, so the gate can never silently become vacuous.
  red-battery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: export-gate RED battery
        run: bash scripts/red-battery.sh
