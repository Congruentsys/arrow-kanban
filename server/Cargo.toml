# SPDX-License-Identifier: MIT
[package]
name = "arrow-kanban-server"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "NATS request-reply server for the arrow-kanban engine — the kanban.cmd.* wire protocol over async-nats."
repository = "https://github.com/Congruentsys/arrow-kanban"
homepage = "https://github.com/Congruentsys/arrow-kanban"
keywords = ["kanban", "nats", "arrow", "server", "project-management"]
categories = ["command-line-utilities"]

[lib]
name = "arrow_kanban_server"
path = "src/lib.rs"

[[bin]]
name = "arrow-kanban-server"
path = "src/main.rs"

[features]
default = ["git", "research"]
# Git bundle transport handlers (source.* commands)
git = []
# HDD experiment-run tracking handlers (hdd.run.* commands)
research = []

[dependencies]
arrow-kanban = { path = "..", version = "0.3.0", default-features = false }
arrow = { version = "57", features = ["prettyprint"] }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-nats = "0.38"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
